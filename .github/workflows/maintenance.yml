name: Maintenance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 13:00 UTC daily — catches a dependency or asset that rotted overnight.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # ── Does the page still work? Runs against the code in the branch. ──────────
  smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Is the published site actually up and correct? ─────────────────────────
  live:
    name: Live site health
    runs-on: ubuntu-latest
    # After a push, wait for Pages to finish publishing before checking it.
    needs: [smoke]
    if: always() && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Wait for Pages to publish
        if: github.event_name == 'push'
        run: sleep 90

      - name: Check the live site
        id: check
        run: node scripts/check-live.mjs

      # A scheduled run failing means the site broke on its own - surface it
      # rather than letting a red tick go unnoticed in the Actions tab.
      - name: Open an issue if the live site is broken
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label maintenance --state open \
            --search "Live site health check failing in:title" --json number --jq '.[0].number')
          body="The scheduled health check failed on $(date -u '+%Y-%m-%d %H:%M UTC').

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Reproduce locally:

              node scripts/check-live.mjs

          Common causes: an asset was removed or renamed, the Tailwind or Google
          Fonts CDN is down, or Open Graph tags were edited to relative paths."

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Live site health check failing" \
              --label maintenance --body "$body"
          fi
